license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
KubeJS recipe user interface extension.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version_range},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kubejs"
type="required"
reason="kubejsRecipeUi extends KubeJS recipe functionality."
versionRange="[8.0.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
reason="Enables recipe UI integration when JEI is installed."
versionRange="[${jei_version_range},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ldlib2"
type="required"
reason="The recipe editor user interface is built with LDLib2."
versionRange="[${ldlib2_version_range},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="extendedcrafting"
type="optional"
reason="Enables Extended Crafting recipe editor workstations when installed."
versionRange="[${extended_crafting_version_range},)"
ordering="AFTER"
side="BOTH"
