plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = 'LatvianMods'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            includeGroupByRegex 'com\\.github\\..*'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'BlakesMods'
        url = 'https://maven.blakesmods.com/releases'
        content {
            includeGroup 'com.blakebr0.extendedcrafting'
            includeGroup 'com.blakebr0.cucumber'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral {
        content {
            includeGroup 'org.jspecify'
            includeGroup 'dev.vfyjxf'
            includeGroup 'org.appliedenergistics.yoga'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    implementation "maven.modrinth:ldlib:${ldlib2_version}"
    // LDLib2 通过 jarJar 内嵌 Taffy 与 Yoga，它们的类型会出现在 LDLib2 的 API 签名里，
    // 因此编译期需要这两个库；两者都有 Maven Central 坐标。
    compileOnly "dev.vfyjxf:taffy:${taffy_version}"
    compileOnly "org.appliedenergistics.yoga:yoga:${yoga_version}"
    compileOnly 'org.jspecify:jspecify:1.0.0'

    // JEI API 仅参与编译，完整模组只加入开发运行环境。
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Extended Crafting 是可选集成；仅在开发客户端加入完整运行依赖。
    compileOnly "com.blakebr0.extendedcrafting:ExtendedCrafting:${extended_crafting_version}"
    localRuntime("com.blakebr0.extendedcrafting:ExtendedCrafting:${extended_crafting_version}") {
        // Jade 只是上游的可选显示集成，编辑器开发环境不需要下载 CurseMaven 文件。
        exclude group: 'curse.maven', module: 'jade-324717'
    }

    // AE2 及其必需的 GuideME 只用于开发客户端测试，不作为本模组的发布依赖。
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    localRuntime "maven.modrinth:guideme:${guideme_version}"
    localRuntime "maven.modrinth:ae2:${ae2_version}"

    // Mekanism 1.21.1 暂无公开开发包；存在本地源码构建包时才加入开发运行环境。
    localRuntime fileTree(dir: "libs", include: ["Mekanism-*.jar"])
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            kubejs_version_range   : kubejs_version_range,
            jei_version_range      : jei_version_range,
            ldlib2_version_range   : ldlib2_version_range,
            extended_crafting_version_range: extended_crafting_version_range,
            ae2_version_range      : ae2_version_range,
            mekanism_version_range: mekanism_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : 'mubai',
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
